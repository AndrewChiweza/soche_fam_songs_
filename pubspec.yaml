name: soche_fam_songs
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.0.0
  firebase_core: ^3.0.0
  share_plus: ^10.0.0
  url_launcher: ^6.1.10
  provider: ^6.1.0
  shared_preferences: ^2.2.2
  google_fonts:
  font_awesome_flutter:
  cupertino_icons:
  hive:
  hive_flutter:
  firebase_auth:
  firebase_messaging:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "images/ic_launcher.png"

flutter:
